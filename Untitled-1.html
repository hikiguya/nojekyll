<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التمارين الذكية 🚀 JS Dashboard</title>
    <style>
        /* --- التنسيقات العامة للمظهر واللوحة --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #1e1e2f;
            color: #ffffff;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* القائمة الجانبية للتنقل */
        .sidebar {
            width: 280px;
            background-color: #11111e;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.3);
        }

        .sidebar h1 {
            font-size: 20px;
            text-align: center;
            margin-bottom: 30px;
            color: #00d2d3;
            border-bottom: 2px solid #282846;
            padding-bottom: 15px;
        }

        .tab-btn {
            background: none;
            border: none;
            color: #a2a2d0;
            padding: 15px 20px;
            text-align: right;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            margin-bottom: 10px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .tab-btn:hover {
            background-color: #1e1e38;
            color: #fff;
        }

        .tab-btn.active {
            background-color: #ff9f43;
            color: #fff;
            box-shadow: 0 4px 15px rgba(255, 159, 67, 0.4);
        }

        /* منطقة عرض التمارين */
        .content-area {
            flex: 1;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-y: auto;
            background: radial-gradient(circle, #252542 0%, #1e1e2f 100%);
        }

        .tab-content {
            display: none;
            width: 100%;
            max-width: 500px;
            animation: fadeIn 0.5s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- تنسيقات التمارين المدمجة --- */
        
        /* المشترك بين الصناديق */
        .app-card {
            background: #282846;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
            border: 1px solid #3d3d6b;
        }
        .app-card h2 { margin-top: 0; margin-bottom: 20px; color: #fff; }
        .app-card label { display: block; text-align: right; margin-top: 10px; font-size: 14px; color: #b5b5b5; }
        
        /* عناصر الإدخال المشتركة للتمارين */
        .app-card input[type="text"], 
        .app-card input[type="number"], 
        .app-card select { 
            width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #3d3d6b; border-radius: 8px; box-sizing: border-box; font-size: 16px; background: #1e1e38; color: white; outline: none; 
        }
        .app-card input:focus { border-color: #ff9f43; }

        /* تمرين 1: قائمة المهام */
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        .input-group input { margin: 0; }
        .add-btn { background-color: #0abde3; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; }
        .add-btn:hover { background-color: #00a8ff; }
        .todo-list { list-style: none; padding: 0; margin: 0; text-align: right; }
        .todo-item { background: #1e1e38; padding: 12px; margin-bottom: 8px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; border-right: 4px solid #0abde3; font-size: 16px; }
        .delete-btn { background-color: #ee5253; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }
        .delete-btn:hover { background-color: #ff6b6b; }

        /* تمرين 2: محول العملات */
        .result-box { margin-top: 25px; padding: 15px; background: #1e1e38; border-radius: 8px; font-size: 20px; font-weight: bold; border-right: 5px solid #ff9f43; min-height: 30px; }
        .loading { font-size: 14px; color: #a2a2d0; }

        /* تمرين 3: محرك البحث */
        .search-list { list-style: none; padding: 0; margin-top: 20px; text-align: right; max-height: 220px; overflow-y: auto; }
        .search-item { background: #1e1e38; padding: 12px; margin-bottom: 6px; border-radius: 8px; border-right: 4px solid #10ac84; font-size: 16px; transition: all 0.2s; }
        .search-item:hover { background: #3d3d6b; transform: translateX(-5px); }
        .no-results { color: #ee5253; font-style: italic; margin-top: 15px; display: none; }

        /* تمرين 4: لعبة الذاكرة */
        .grid { display: grid; grid-template-columns: repeat(4, 75px); gap: 12px; justify-content: center; margin-top: 20px; }
        .card { width: 75px; height: 75px; background-color: #3d3d6b; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: bold; color: transparent; cursor: pointer; user-select: none; transition: background-color 0.3s, transform 0.2s; }
        .card:hover { transform: scale(1.05); background-color: #48487f; }
        .card.flipped { background-color: #0abde3; color: white; cursor: default; }
        .card.matched { background-color: #10ac84; color: white; cursor: default; animation: pulse 0.3s; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <!-- القائمة الجانبية -->
    <div class="sidebar">
        <h1>لوحة تحكم التمارين 🛠️</h1>
        <button class="tab-btn active" onclick="switchTab('todo-tab')">📝 قائمة المهام</button>
        <button class="tab-btn" onclick="switchTab('converter-tab')">💸 محول العملات</button>
        <button class="tab-btn" onclick="switchTab('search-tab')">🔍 محرك البحث اللحظي</button>
        <button class="tab-btn" onclick="switchTab('memory-tab')">🧠 لعبة الذاكرة</button>
    </div>

    <!-- منطقة عرض التطبيقات القابلة للتبديل -->
    <div class="content-area">

        <!-- التمرين الأول: قائمة المهام -->
        <div id="todo-tab" class="tab-content active">
            <div class="app-card">
                <h2>قائمـة مهامي 📝</h2>
                <div class="input-group">
                    <input type="text" id="taskInput" placeholder="أضف مهمة جديدة...">
                    <button id="addBtn" class="add-btn">إضافة</button>
                </div>
                <ul id="taskList" class="todo-list"></ul>
            </div>
        </div>

        <!-- التمرين الثاني: محول العملات -->
        <div id="converter-tab" class="tab-content">
            <div class="app-card" style="border-color: #ff9f43;">
                <h2 style="color: #ff9f43;">محول العملات اللحظي 💸</h2>
                <label>المبلغ بالدرهم المغربي (MAD):</label>
                <input type="number" id="amountInput" value="100" placeholder="أدخل المبلغ...">
                <label>تحويل إلى:</label>
                <select id="currencySelect">
                    <option value="USD">دولار أمريكي (USD) 🇺🇸</option>
                    <option value="EUR">يورو أوروبي (EUR) 🇪🇺</option>
                    <option value="SAR">ريال سعودي (SAR) 🇸🇦</option>
                    <option value="AED">درهم إماراتي (AED) 🇦🇪</option>
                </select>
                <div class="result-box" id="resultDiv">
                    <span class="loading">جاري جلب أسعار الصرف... 🔄</span>
                </div>
            </div>
        </div>

        <!-- التمرين الثالث: محرك البحث اللحظي -->
        <div id="search-tab" class="tab-content">
            <div class="app-card" style="border-color: #10ac84;">
                <h2 style="color: #10ac84;">محرك بحث الألعاب 🎮</h2>
                <input type="text" id="searchInput" placeholder="ابحث عن لعبتك المفضلة...">
                <ul id="gamesList" class="search-list"></ul>
                <div id="noResults" class="no-results">عذراً، لم نجد أي لعبة بهذا الاسم! 😢</div>
            </div>
        </div>

        <!-- التمرين الرابع: لعبة الذاكرة -->
        <div id="memory-tab" class="tab-content">
            <div class="app-card" style="border-color: #0abde3;">
                <h2 style="color: #0abde3;">لعبة اختبار الذاكرة 🧠</h2>
                <p style="color: #b5b5b5; margin: 0;">ابحث عن الأرقام المتشابهة!</p>
                <div class="grid" id="gameGrid"></div>
            </div>
        </div>

    </div>

<script>
    // ==========================================
    // أولاً: منطق التنقل بين التبويبات (Tabs Logic)
    // ==========================================
    function switchTab(tabId) {
        // إخفاء كل المحتويات
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        // إزالة التنشيط من كل الأزرار
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

        // إظهار التبويب المطلوب وتنشيط زره
        document.getElementById(tabId).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    // ==========================================
    // كود التمرين الأول: قائمة المهام (Todo List)
    // ==========================================
    const taskInput = document.getElementById('taskInput');
    const addBtn = document.getElementById('addBtn');
    const taskList = document.getElementById('taskList');

    document.addEventListener('DOMContentLoaded', loadTasks);
    addBtn.addEventListener('click', addTask);

    function addTask() {
        const taskText = taskInput.value.trim();
        if (taskText === "") { alert("من فضلك اكتب شيئاً أولاً! ⚠️"); return; }
        createTaskElement(taskText);
        saveTaskToLocalStorage(taskText);
        taskInput.value = "";
    }

    function createTaskElement(text) {
        const li = document.createElement('li');
        li.className = "todo-item";
        li.innerText = text;

        const deleteBtn = document.createElement('button');
        deleteBtn.innerText = "حذف";
        deleteBtn.className = "delete-btn";
        deleteBtn.addEventListener('click', function() {
            li.remove();
            removeTaskFromLocalStorage(text);
        });

        li.appendChild(deleteBtn);
        taskList.appendChild(li);
    }

    function saveTaskToLocalStorage(task) {
        let tasks = getTasksFromStorage();
        tasks.push(task);
        localStorage.setItem('myTasks', JSON.stringify(tasks));
    }

    function getTasksFromStorage() {
        return localStorage.getItem('myTasks') === null ? [] : JSON.parse(localStorage.getItem('myTasks'));
    }

    function loadTasks() {
        let tasks = getTasksFromStorage();
        tasks.forEach(task => createTaskElement(task));
    }

    function removeTaskFromLocalStorage(taskToDelete) {
        let tasks = getTasksFromStorage();
        tasks = tasks.filter(task => task !== taskToDelete);
        localStorage.setItem('myTasks', JSON.stringify(tasks));
    }

    // ==========================================
    // كود التمرين الثاني: محول العملات (Converter)
    // ==========================================
    const amountInput = document.getElementById('amountInput');
    const currencySelect = document.getElementById('currencySelect');
    const resultDiv = document.getElementById('resultDiv');

    amountInput.addEventListener('input', convertCurrency);
    currencySelect.addEventListener('change', convertCurrency);

    async function convertCurrency() {
        const amount = amountInput.value;
        const targetCurrency = currencySelect.value;

        if (amount === "" || amount <= 0) {
            resultDiv.innerText = "0 " + targetCurrency;
            return;
        }

        resultDiv.innerHTML = '<span class="loading">جاري الحساب... 🔄</span>';

        try {
            const response = await fetch('https://open.er-api.com/v6/latest/MAD');
            const data = await response.json();
            const rate = data.rates[targetCurrency];
            const convertedAmount = (amount * rate).toFixed(2);
            resultDiv.innerText = `${amount} MAD = ${convertedAmount} ${targetCurrency}`;
        } catch (error) {
            resultDiv.innerText = "فشل الاتصال بالسيرفر! ⚠️";
        }
    }
    convertCurrency();

    // ==========================================
    // كود التمرين الثالث: محرك البحث اللحظي (Search)
    // ==========================================
    const games = [
        "Grand Theft Auto V", "Minecraft", "Counter-Strike 2", "Valorant",
        "League of Legends", "EA Sports FC 24", "Red Dead Redemption 2",
        "Cyberpunk 2077", "Elden Ring", "Fortnite", "Resident Evil 4", "God of War"
    ];

    const searchInput = document.getElementById('searchInput');
    const gamesList = document.getElementById('gamesList');
    const noResults = document.getElementById('noResults');

    function displayGames(gamesArray) {
        gamesList.innerHTML = "";
        if (gamesArray.length === 0) { noResults.style.display = "block"; return; }
        noResults.style.display = "none";

        gamesArray.forEach(function(game) {
            const li = document.createElement('li');
            li.className = "search-item";
            li.innerText = game;
            gamesList.appendChild(li);
        });
    }

    searchInput.addEventListener('input', function() {
        const searchText = searchInput.value.toLowerCase();
        const filteredGames = games.filter(game => game.toLowerCase().includes(searchText));
        displayGames(filteredGames);
    });
    displayGames(games);

    // ==========================================
    // كود التمرين الرابع: لعبة الذاكرة (Memory Game)
    // ==========================================
   //  صح: مصفوفة تحتوي على الكروت مكررة ومفصولة
const cardValues = [
    "☃️", "☃️", "🤡", "🤡", "👻", "👻", "🌝", "🌝", 
    "🌚", "🌚", "🎊", "🎊", "🎉", "🎉", "☄️", "☄️"
];
// خلط الكروت عشوائياً في كل مرة تفتح الصفحة
cardValues.sort(() => 0.5 - Math.random());

    const gameGrid = document.getElementById('gameGrid');
    let firstCard = null, secondCard = null, lockBoard = false;

    function createBoard() {
        cardValues.forEach(function(value) {
            const card = document.createElement('div');
            card.classList.add('card');
            card.dataset.value = value;
            card.innerText = value;
            card.addEventListener('click', flipCard);
            gameGrid.appendChild(card);
        });
    }

    function flipCard() {
        if (lockBoard) return;
        if (this === firstCard) return;

        this.classList.add('flipped');

        if (!firstCard) { firstCard = this; return; }

        secondCard = this;
        checkMatch();
    }

    function checkMatch() {
        let isMatch = firstCard.dataset.value === secondCard.dataset.value;
        isMatch ? disableCards() : unflipCards();
    }

    function disableCards() {
        firstCard.classList.add('matched');
        secondCard.classList.add('matched');
        resetTurn();
    }

    function unflipCards() {
        lockBoard = true;
        setTimeout(function() {
            firstCard.classList.remove('flipped');
            secondCard.classList.remove('flipped');
            resetTurn();
        }, 1000);
    }

    function resetTurn() {
        [firstCard, secondCard, lockBoard] = [null, null, false];
    }
    createBoard();
</script>

</body>
</html>
