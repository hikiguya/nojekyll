<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لعبة أسئلة بسيطة</title>
    <style>
       body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center;  
            background: radial-gradient(circle, rgb(90, 20, 20), rgb(50, 10, 10));
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card { 
            background-color: rgb(250, 250, 240);
            padding: 30px; 
            width: 40%; 
            border-radius: 15px;
            box-shadow: 10px 10px 30px #ffffff80; 
            transition: transform 0.3s ease;
        }

       

        h2 { color: #000000; margin-bottom: 20px; }

        button { 
            display: block; 
            width: 100%; 
            margin: 15px 0;
            padding: 15px; 
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.2rem;
            background: radial-gradient(circle, #c0c0c0, #808080);
            color: #ffffff; 
            transition: filter 0.2s, scale 0.1s;
        }

        button:hover {
            filter: brightness(1.1);
        }

        button:active {
            scale: 0.98;
        }
    </style>
</head>
<body>

<div class="card">
    <h2 id="ques">السؤال يظهر هنا</h2>
    <!-- أزرار ثابتة نغير نصوصها فقط -->
    <button onclick="check(0)" id="btn0">اختيار 1</button>
    <button onclick="check(1)" id="btn1">اختيار 2</button>
    <button onclick="check(2)" id="btn2">اختيار 3</button>
    
    <p id="res"></p>
    <p>النقاط: <span id="scr">0</span></p>
    <p>الوقت المتبقي: <span id="timer" style="color: rgb(100, 20, 20); font-weight: bold;">10</span> ثانية</p>
</div>
<script>
    var questions = ["ما هو لون السماء؟", "ما هو عاصمة المغرب؟", "1 + 1 = ?"];
    var choices = [
        ["أحمر", "أزرق", "أخضر"],
        ["الرباط", "باريس", "لندن"],
        ["5", "3", "2"]
    ];
    var answers = ["أزرق", "الرباط", "2"];

    var index = 0;
    var score = 0;
    var timeLeft = 10;
    var timer; 

    function startTimer() {
        timeLeft = 10;
        document.getElementById("timer").innerText = timeLeft;
        
        clearInterval(timer); 

        timer = setInterval(function() {
            timeLeft--;
            document.getElementById("timer").innerText = timeLeft;

            if (timeLeft <= 0) {
                clearInterval(timer);
                check(-1); 
            }
        }, 1000);
        
    }

    function show() {
        if (index < questions.length) {
            document.getElementById("ques").innerText = questions[index];
            document.getElementById("btn0").innerText = choices[index][0];
            document.getElementById("btn1").innerText = choices[index][1];
            document.getElementById("btn2").innerText = choices[index][2];
            document.getElementById("res").innerText = ""; 
            
            startTimer(); 
        } else {
            clearInterval(timer);
            showFinalResult();
        }
    }

    function check(btnNumber) {
        clearInterval(timer); 
        var correctChoice = answers[index];
        var userChoice = (btnNumber === -1) ? "انتهى الوقت" : choices[index][btnNumber];

        if (userChoice === correctChoice) {
            score++;
            document.getElementById("res").innerText = "صح! ✅";
        } else {
            document.getElementById("res").innerText = (btnNumber === -1) ? "انتهى الوقت! ⏰" : "خطأ! ❌";
        }

        document.getElementById("scr").innerText = score;
        
        index++;
        setTimeout(show, 2000); 
    }

    function showFinalResult() {
        var status = (score >= 2) ? "Smart 🧠" : "Stupid 🤡";
        var statusColor = (score >= 2) ? "#4CAF50" : "#ff4444";
        document.body.innerHTML = `
            <div style="text-align:center; padding:50px;">
                <h1 style="color:white">انتهت اللعبة! 🏁</h1>
                <div style="color:${statusColor}; font-size: 40px; font-weight: bold; margin: 20px;">
                    ${status}
                </div>
                <p style="color:white">نقاطك النهائية هي: ${score} من ${questions.length}</p>
                <button onclick="location.reload()" style="background-color:darkblue;color:white; width:300px;
                 border-radius:30px;  margin:auto;">إعادة اللعب</button>
            </div>
        `;
    }
    
    show(); 
</script>
</body>
</html>
