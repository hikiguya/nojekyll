<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpaceCréatif Café - Premium Experience</title>
    <style>
        /* ==========================================================================
           1. الألوان الجاهزة والخطوط
           ========================================================================== */
        :root {
            --primary-color: #c77a58;       
            --primary-hover: #b06543;       
            --nav-text-color: #a4684d;      
            
            --bg-gradient: linear-gradient(45deg, #3f261b 0%, #875a45 50%, #af7357 100%); 
            
            --text-light: #ffffff;          
            --text-muted: #e5d5cc;          
            --text-dark: #2d1a12;           
            --text-dark-muted: #61524c;     
            
            --font-serif: 'Georgia', 'Times New Roman', serif; 
            --font-sans: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* ==========================================================================
           2. التنسيق العام للموقع (Reset & Body)
           ========================================================================== */
        body {
            font-family: var(--font-sans);
            margin: 0;
            padding: 0;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-light);
            overflow-x: hidden;
        }

        /* ==========================================================================
           3. شريط التنقل العلوي (Navbar)
           ========================================================================== */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 8%;
            background-color: #ffffff; 
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 2px solid rgba(164, 104, 77, 0.15); 
            box-sizing: border-box;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12); 
        }

        .navbar .logo {
            font-family: var(--font-serif);
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--nav-text-color); 
            text-decoration: none;
        }

        .navbar .logo span {
            color: var(--primary-color);
        }

        .navbar .nav-links a {
            color: var(--nav-text-color); 
            text-decoration: none;
            margin: 0 15px;
            font-size: 15px;
            font-weight: 600;
            transition: color 0.3s ease;
            position: relative;
        }

        .navbar .nav-links a:hover, 
        .navbar .nav-links a.active {
            color: var(--primary-color); 
        }

        .navbar .nav-links a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -5px;
            left: 0;
            background-color: var(--primary-color);
            transition: width 0.3s ease;
        }

        .navbar .nav-links a:hover::after {
            width: 100%;
        }

        .nav-cta {
            background-color: transparent;
            color: var(--nav-text-color);
            border: 2px solid var(--nav-text-color);
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .nav-cta:hover {
            background-color: var(--nav-text-color);
            color: white;
        }

        /* ==========================================================================
           4. قسم الهيرو الرئيسي (Hero Section)
           ========================================================================== */
        .hero-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
            padding: 60px 8%;
            min-height: calc(100vh - 80px);
            box-sizing: border-box;
        }

        .hero-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            animation: fadeInLeft 1s ease-out;
        }

        .hero-title {
            font-family: var(--font-serif);
            font-size: 54px;
            font-weight: 700;
            line-height: 1.2;
            margin: 0 0 20px 0;
            color: var(--text-light); 
        }

        .hero-description {
            font-size: 16px;
            line-height: 1.6;
            color: var(--text-muted);
            max-width: 500px;
            margin: 0 0 35px 0;
        }

        .hero-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap; /* باش يلا تضيق الوقت فالموبايل يهبطو الازرار تحت بعضهم بلا مشاكل */
        }

        .hero-btn-primary {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .hero-btn-primary:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }

        .hero-btn-secondary {
            background-color: transparent;
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.2);
            padding: 14px 30px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .hero-btn-secondary:hover {
            border-color: white;
            background-color: rgba(255, 255, 255, 0.05);
        }

        .hero-image-container {
            flex: 1;
            display: flex;
            justify-content: flex-end;
            animation: fadeInRight 1s ease-out;
            width: 100%;
        }

        .hero-image {
            width: 100%;
            max-width: 500px;  
            height: auto;     
            aspect-ratio: 1 / 1; /* كتحافظ على شكل مربع متناسق ومتجاوب */
            object-fit: cover; 
            border-radius: 24px; 
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
            transition: transform 0.5s ease;
        }

        .hero-image:hover {
            transform: scale(1.02) rotate(-1deg);
        }

        /* ==========================================================================
           5. قسم المميزات (Features Grid Section)
           ========================================================================== */
        .features-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            padding: 80px 8%;
            background-color: rgb(249, 237, 219); 
            box-sizing: border-box;
            scroll-margin-top: 90px; 
        }

        .feature-card {
            background-color: rgb(255, 255, 255); 
            border: 1px solid rgb(243, 226, 202);
            padding: 40px 30px;
            border-radius: 24px;
            text-align: center;
