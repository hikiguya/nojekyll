<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لعبة تخمين الرقم</title>
    <style>
        body {
            background: radial-gradient(#461c02, #281001);
            color: #bc825b;
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .game-box {
            border: 5px solid #df9f68;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        input {
            background: transparent;
            border: 2px solid #df9f68;
            color: white;
            padding: 10px;
            font-size: 20px;
            width: 60px;
            text-align: center;
        }
        button {
            background: #df9f68;
            color: #281001;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background: #bc825b; }
        #message { margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>

<div class="game-container">
    <div id="question-area">
        <h2 id="question-text">السؤال سيظهر هنا</h2>
        <div id="options-buttons">
            <!-- الأزرار ستنشأ بواسطة JS -->
        </div>
    </div>
    <div id="result-message"></div>
    <p>السكور الحالي: <span id="score">0</span></p>
</div>
<script>
    // 1. قاعدة بيانات الأسئلة (داخل المصفوفة)
const quizData = [
    {
        question: "ما هي اللغة التي نستخدمها لإضافة تفاعل للمواقع؟",
        options: ["CSS", "HTML", "JavaScript", "PHP"],
        correct: "JavaScript"
    },
    {
        question: "ما هو الرمز المستخدم للمقارنة الصارمة؟",
        options: ["==", "=", "===", "!="],
        correct: "==="
    },
    {
        question: "أي دالة تستخدم لعرض رسالة تنبيه؟",
        options: ["console.log()", "alert()", "prompt()", "print()"],
        correct: "alert()"
    },
    {
 question:"fffffffffffffffffff?",
 options:[
    "nnnnn","hhhh","jjjj","ftfgf"
 ],
 correct:"jjjj"
    }
];

let currentQuestionIndex = 0;
let score = 0;

function loadQuestion() {
    const currentQuiz = quizData[currentQuestionIndex];
    const questionEl = document.getElementById("question-text");
    const optionsContainer = document.getElementById("options-buttons");
    const messageEl = document.getElementById("result-message");

    // تنظيف المنطقة قبل وضع السؤال الجديد
    questionEl.innerText = currentQuiz.question;
    optionsContainer.innerHTML = "";
    messageEl.innerText = "";

    // 2. إنشاء الأزرار ديناميكياً لكل اختيار
    currentQuiz.options.forEach(choice =>{
        const button = document.createElement("button");
        button.innerText = choice;
        button.className = "option-btn";
        
        button.onclick = () => checkAnswer(choice);
        optionsContainer.appendChild(button);
    });
}

function checkAnswer(userChoice) {
    const correctAnswer = quizData[currentQuestionIndex].correct;
    const messageEl = document.getElementById("result-message");

    if (userChoice === correctAnswer) {
        score++;
        document.getElementById("score").innerText = score;
        messageEl.innerText = "أحسنت! إجابة صحيحة 🎉";
        messageEl.style.color = "#2ecc71";
    } else {
        messageEl.innerText = "خطأ! الإجابة كانت: " + correctAnswer + " ❌";
        messageEl.style.color = "#e74c3c";
    }

    // الانتظار قليلاً ثم الانتقال للسؤال التالي
    currentQuestionIndex++;

    if (currentQuestionIndex < quizData.length) {
        setTimeout(loadQuestion, 1500);
    } else {
        setTimeout(() => {
            document.getElementById("question-area").innerHTML = "<h3>انتهت اللعبة! 🏁</h3>";
            messageEl.innerText = "نتيجتك النهائية هي: " + score + " من " + quizData.length;
        }, 1500);
    }
}

// تشغيل اللعبة لأول مرة
loadQuestion();
</script>

</body>
</html>
